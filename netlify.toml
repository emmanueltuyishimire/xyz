[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# -------------------------------------------------------
# Canonical www redirect — non-www → www (301 Permanent)
# Ensures Google only indexes the www version of the site.
# This is the single source of truth for URL canonicalization.
# -------------------------------------------------------
[[redirects]]
  from = "https://seniorsaudit.com/*"
  to = "https://www.seniorsaudit.com/:splat"
  status = 301
  force = true

# Redirect /admin to Decap CMS admin UI
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Map sitemap.xml to the sitemap-index.xml file generated by Astro
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 200

# -------------------------------------------------------
# 301 Permanent Redirects for Legacy / Alias URLs (Ahrefs Fixes)
# -------------------------------------------------------
[[redirects]]
  from = "/tools/medicaid-eligibility-checker/*"
  to = "/tools/medicare-savings-estimator/"
  status = 301

[[redirects]]
  from = "/retirement/irs-life-expectancy-tables/*"
  to = "/tools/rmd-calculator/"
  status = 301

[[redirects]]
  from = "/medicaid/medicare-savings-programs/*"
  to = "/medicare/medicare-savings-programs/"
  status = 301

[[redirects]]
  from = "/tools/magi-calculator/*"
  to = "/tools/magi-for-medicare-calculator/"
  status = 301

[[redirects]]
  from = "/taxes/pension-tax-rules/*"
  to = "/tools/retirement-tax-withholding-calculator/"
  status = 301

[[redirects]]
  from = "/tools/tax-document-comparison/*"
  to = "/tools/irs-cp2000-response-guide/"
  status = 301

[[redirects]]
  from = "/medicaid/qmb-program-overview/*"
  to = "/medicare/medicare-savings-programs/"
  status = 301

[[redirects]]
  from = "/tools/irmaa-calculator/*"
  to = "/tools/medicare-irmaa-calculator/"
  status = 301

# SPA fallback is NOT needed for static Astro — each page is its own HTML file

[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # HSTS — enforce HTTPS, include subdomains, request browser preload list inclusion
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Cross-Origin-Opener-Policy — isolate browsing context from cross-origin popups
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Content Security Policy
    # — Allows Google Fonts, Netlify Identity, Jotform, Google Analytics/GTM, and Ahrefs Analytics
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com https://unpkg.com https://www.jotform.com https://submit.jotform.com https://www.googletagmanager.com https://analytics.ahrefs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.jotform.com; font-src 'self' https://fonts.gstatic.com https://www.jotform.com; img-src 'self' data: https: https://www.google-analytics.com; frame-src https://www.jotform.com https://submit.jotform.com; connect-src 'self' https://api.netlify.com https://identity.netlify.com https://submit.jotform.com https://www.google-analytics.com https://*.google-analytics.com https://stats.g.doubleclick.net https://www.google.com https://www.googletagmanager.com https://analytics.ahrefs.com; object-src 'none';"

[[headers]]
  for = "/admin/*"
  [headers.values]
    # CMS-specific headers allowing unsafe-eval
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://unpkg.com https://www.jotform.com https://submit.jotform.com https://www.googletagmanager.com https://analytics.ahrefs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.jotform.com; font-src 'self' https://fonts.gstatic.com https://www.jotform.com; img-src 'self' data: https: https://www.google-analytics.com; frame-src https://www.jotform.com https://submit.jotform.com; connect-src 'self' https://api.netlify.com https://identity.netlify.com https://submit.jotform.com https://www.google-analytics.com https://*.google-analytics.com https://stats.g.doubleclick.net https://www.google.com https://www.googletagmanager.com https://analytics.ahrefs.com; object-src 'none';"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

