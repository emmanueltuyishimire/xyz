[build]
  publish = "dist"
  command = "node scripts/test_sitemap.mjs && node scripts/test_constants.mjs && npm run build && node scripts/test_dist_sitemap.mjs"

[build.environment]
  NODE_VERSION = "22"

# -------------------------------------------------------
# Canonical www redirect — non-www → www (301 Permanent)
# Ensures Google only indexes the www version of the site.
# This is the single source of truth for URL canonicalization.
# -------------------------------------------------------
[[redirects]]
  from = "https://seniorsaudit.com/*"
  to = "https://www.seniorsaudit.com/:splat"
  status = 301
  force = true


# Medicare vs Medicaid Calculator moved to /tools/ directory
[[redirects]]
  from = "/medicare/medicare-vs-medicaid/"
  to = "/tools/medicare-vs-medicaid-calculator/"
  status = 301
  force = true
# Redirect /admin to Decap CMS admin UI
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

