# SPA fallback is NOT needed for static Astro — each page is its own HTML file

[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # HSTS — enforce HTTPS, include subdomains, request browser preload list inclusion
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Cross-Origin-Opener-Policy — isolate browsing context from cross-origin popups
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Content Security Policy
    # — Allows Google Fonts, Netlify Identity, Jotform, Ahrefs Analytics, Google AdSense, and Google Analytics 4
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com https://unpkg.com https://www.jotform.com https://submit.jotform.com https://analytics.ahrefs.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://adservice.google.com https://partner.googleadservices.com https://*.googleadservices.com https://www.googletagservices.com https://*.googletagservices.com https://www.googletagmanager.com https://*.googletagmanager.com https://*.google.com https://*.adtrafficquality.google https://*.doubleclick.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.jotform.com; font-src 'self' https://fonts.gstatic.com https://www.jotform.com; img-src 'self' data: https: blob:; frame-src https://www.jotform.com https://submit.jotform.com https://googleads.g.doubleclick.net https://*.doubleclick.net https://tpc.googlesyndication.com https://*.googlesyndication.com https://www.google.com https://*.google.com https://*.adtrafficquality.google; connect-src 'self' https://api.netlify.com https://identity.netlify.com https://submit.jotform.com https://analytics.ahrefs.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://adservice.google.com https://partner.googleadservices.com https://*.googleadservices.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com https://*.googletagmanager.com https://www.google.com https://*.google.com https://stats.g.doubleclick.net https://*.doubleclick.net https://*.g.doubleclick.net https://*.adtrafficquality.google https://*.google; object-src 'none';"

[[headers]]
  for = "/admin/*"
  [headers.values]
    # CMS-specific headers allowing unsafe-eval
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://unpkg.com https://www.jotform.com https://submit.jotform.com https://analytics.ahrefs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.jotform.com; font-src 'self' https://fonts.gstatic.com https://www.jotform.com; img-src 'self' data: https:; frame-src https://www.jotform.com https://submit.jotform.com; connect-src 'self' https://api.netlify.com https://identity.netlify.com https://submit.jotform.com https://analytics.ahrefs.com; object-src 'none';"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

